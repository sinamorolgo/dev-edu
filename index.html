<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비개발자를 위한 개발 이해</title>
  <style>
    :root {
      --ink: #17211f;
      --muted: #63716d;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --line: #d9ded6;
      --dark: #20302d;
      --green: #238362;
      --blue: #2563eb;
      --amber: #d88916;
      --violet: #6f58d9;
      --soft-green: #e8f7ee;
      --soft-blue: #e8f0ff;
      --soft-amber: #fff3d8;
      --soft-violet: #eee9ff;
      --shadow: 0 18px 46px rgba(23, 33, 31, 0.12);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(251, 250, 246, 0) 360px),
        var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.62;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1060px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
    }

    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--dark);
    }

    h2,
    h3,
    p {
      margin-top: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 18px 0 28px;
    }

    .card {
      min-height: 178px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      grid-template-rows: auto auto auto;
      gap: 10px 18px;
      padding: 16px;
      border: 1px solid rgba(23, 33, 31, 0.12);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      outline: 3px solid rgba(37, 99, 235, 0.18);
      outline-offset: 2px;
    }

    .card-top {
      grid-column: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .badge {
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-size: 12px;
      font-weight: 900;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .thumb {
      grid-column: 2;
      grid-row: 1 / 4;
      min-height: 146px;
      display: grid;
      gap: 10px;
      align-content: center;
      padding: 14px;
      border-radius: 8px;
      background: var(--thumb-bg);
    }

    .line {
      height: 12px;
      border-radius: 999px;
      background: rgba(23, 33, 31, 0.13);
    }

    .line:nth-child(1) {
      width: 70%;
      background: var(--accent);
    }

    .line:nth-child(2) {
      width: 92%;
    }

    .line:nth-child(3) {
      width: 58%;
    }

    .card h2 {
      margin-bottom: 8px;
      font-size: 26px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .card p {
      margin-bottom: 0;
      color: var(--muted);
      word-break: keep-all;
    }

    .cta {
      min-height: 44px;
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #fff;
      background: var(--dark);
      font-weight: 900;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 1060px);
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 0;
      }

      .card {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px;
      }

      .card h2 {
        font-size: 22px;
        margin-bottom: 6px;
      }

      .card p {
        font-size: 14px;
        line-height: 1.48;
      }

      .thumb {
        display: none;
      }

      .cta {
        min-height: 40px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <header class="shell top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3"></path><path d="m16 9 4 3-4 3"></path><path d="m14 5-4 14"></path></svg>
      </span>
      <span>개발 이해 가이드</span>
    </div>
  </header>

  <main class="shell">
    <section class="cards" aria-label="교육 페이지 목록">
      <a class="card" href="./git-branch-pr-guide.html" style="--badge-bg:var(--soft-green);--badge-fg:var(--green);--thumb-bg:var(--soft-green);--accent:var(--green)">
        <div class="card-top">
          <span class="badge">실무</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 3v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="6" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
        </div>
        <div>
          <h2>Git 브랜치와 PR</h2>
          <p>commit, push, PR의 차이를 위치와 검토 흐름으로 이해하고 실무에 연결합니다.</p>
        </div>
        <div class="thumb" aria-hidden="true">
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </div>
        <span class="cta">열어보기 <svg class="icon" viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg></span>
      </a>
      <a class="card" href="./git-branch-pr-guide-v2.html" style="--badge-bg:var(--soft-blue);--badge-fg:var(--blue);--thumb-bg:var(--soft-blue);--accent:var(--blue)">
        <div class="card-top">
          <span class="badge">새 버전</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M7 7h6a4 4 0 0 1 0 8H7"></path><path d="M7 15l4-4-4-4"></path><path d="M17 7h1a3 3 0 0 1 3 3v8"></path><path d="M18 15l3 3 3-3"></path></svg>
        </div>
        <div>
          <h2>Git 브랜치와 PR 학습 지도</h2>
          <p>공식 문서 조사와 설명 설계를 바탕으로 브랜치, push, PR, merge를 한 흐름으로 다시 익힙니다.</p>
        </div>
        <div class="thumb" aria-hidden="true">
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </div>
        <span class="cta">비교하기 <svg class="icon" viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg></span>
      </a>
    </section>
  </main>
</body>
</html>
